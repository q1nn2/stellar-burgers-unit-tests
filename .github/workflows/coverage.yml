name: Проверка юнит-тестов и покрытия

on:
  push:
    branches:
      - develop1
    paths-ignore:
      - "htmlcov/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Настроить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установить зависимости
        run: pip install -r requirements.txt

      - name: Запустить юнит-тесты
        run: |
          rm -rf htmlcov
          pytest

      - name: Сохранить HTML-отчёт покрытия
        run: |
          git config user.name "q1nn2"
          git config user.email "90451521+q1nn2@users.noreply.github.com"
          git add -f htmlcov
          if git diff --cached --quiet; then
            echo "Изменений в отчёте покрытия нет"
          else
            git commit -m "Добавлен HTML-отчёт покрытия"
            git push origin HEAD:develop1
          fi
